    <script>
        const { app } = require('photoshop');
        const { executeAsModal } = require('photoshop').core;

        function updateStatus(message, color = '#00FF41') {
            const statusEl = document.getElementById('status-text');
            statusEl.textContent = message;
            statusEl.style.color = color;
        }

        async function rgbSplitLinear() {
            try {
                updateStatus('APPLYING RGB SPLIT LINEAR...', '#FF9900');

                if (!app.activeDocument) {
                    updateStatus('ERROR: NO DOCUMENT OPEN', '#FF0000');
                    return;
                }

                if (!app.activeDocument.activeLayers || app.activeDocument.activeLayers.length === 0) {
                    updateStatus('ERROR: NO LAYER SELECTED', '#FF0000');
                    return;
                }

                await executeAsModal(async () => {
                    const doc = app.activeDocument;
                    const originalLayer = doc.activeLayers[0];

                    const redLayer = await originalLayer.duplicate();
                    redLayer.name = "Red Shift";
                    await redLayer.translate(20, 0);

                    const blueLayer = await originalLayer.duplicate();
                    blueLayer.name = "Blue Shift";
                    await blueLayer.translate(-20, 0);

                    redLayer.blendMode = "lighten";
                    blueLayer.blendMode = "lighten";

                }, { commandName: 'RGB Split Linear' });

                updateStatus('SUCCESS: RGB SPLIT APPLIED', '#00FF41');

            } catch (error) {
                updateStatus('ERROR: ' + error.message, '#FF0000');
                console.error(error);
            }
        }

                    const blueLayer = await originalLayer.duplicate();

        async function scanlineCorrupt() {

                    return;
                }

                await executeAsModal(async () => {
                    const { action } = require('photoshop');

                    // SAFE: Use Wave filter instead of Displace (no external file needed)
                    await action.batchPlay([{
                        "_obj": "wave",
                        "numberOfGenerators": 3,
                        "minimumWavelength": { "_unit": "pixelsUnit", "_value": 10 },
                        "maximumWavelength": { "_unit": "pixelsUnit", "_value": 50 },
                        "minimumAmplitude": { "_unit": "pixelsUnit", "_value": 1 },
                        "maximumAmplitude": { "_unit": "pixelsUnit", "_value": 10 },
                        "horizontalScale": { "_unit": "percentUnit", "_value": 100 },
                        "verticalScale": { "_unit": "percentUnit", "_value": 1 },
                        "waveType": { "_enum": "waveType", "_value": "sine" },
                        "undefinedAreas": { "_enum": "undefinedAreas", "_value": "repeatEdgePixels" }
                    }], {});
                }, { commandName: 'Scanline Corrupt' });

                updateStatus('SUCCESS: SCANLINE APPLIED', '#00FF41');
            } catch (error) {
                updateStatus('ERROR: ' + error.message, '#FF0000');

                    redLayer.name = "Chromatic R";
                    await redLayer.translate(5, 5);

                    const greenLayer = await originalLayer.duplicate();
                    greenLayer.name = "Chromatic G";

                    const blueLayer = await originalLayer.duplicate();
                    blueLayer.name = "Chromatic B";
                    await blueLayer.translate(-5, -5);

                    // Set blend modes
                    redLayer.blendMode = "screen";
                    greenLayer.blendMode = "screen";
                    blueLayer.blendMode = "screen";

                    // Lower opacity for subtler effect
                    redLayer.opacity = 70;
                    blueLayer.opacity = 70;

                }, { commandName: 'Chromatic Aberration' });

                updateStatus('SUCCESS: CHROMATIC ABERRATION APPLIED', '#00FF41');

        async function y2kHalftoneCrush() {
            try {
                updateStatus('APPLYING Y2K HALFTONE CRUSH...', '#FF9900');
                if (!app.activeDocument || !app.activeDocument.activeLayers[0]) {
                    updateStatus('ERROR: NO LAYER SELECTED', '#FF0000');
                    return;
                }

                await executeAsModal(async () => {
                    const { action } = require('photoshop');

                    // Step 1: Extreme contrast conversion (Threshold for pure B&W)
                    await action.batchPlay([{
                        "_obj": "thresholdClassEvent",
                        "level": 128
                    }], {});

                    // Step 2: Apply Color Halftone with large radius for aggressive dots
                    await action.batchPlay([{
                        "_obj": "colorHalftone",
                        "maximumRadius": 12,
                        "screenAngleChannel1": 45,
                        "screenAngleChannel2": 45,
                        "screenAngleChannel3": 45,
                        "screenAngleChannel4": 45
                    }], {});

                    // Step 3: Gradient Map for Red/Black recolorization
                    // Create gradient from Black (#000000) to Red (#FF3300)
                    await action.batchPlay([{
                        "_obj": "gradientMap",
                        "gradientMap": {
                            "_obj": "gradientClassEvent",
                            "name": "Y2K Red",
                            "gradientForm": { "_enum": "gradientForm", "_value": "customStops" },
                            "interfaceIconFrameDimmed": 4096,
                            "colors": [
                                {
                                    "_obj": "colorStop",
                                    "location": 0,
                                    "midpoint": 50,
                                    "type": { "_enum": "colorStopType", "_value": "userStop" },
                                    "color": {
                                        "_obj": "RGBColor",
                                        "red": 0,
                                        "grain": 0,
                                        "blue": 0
                                    }
                                },
                                {
                                    "_obj": "colorStop",
                                    "location": 4096,
                                    "midpoint": 50,
                                    "type": { "_enum": "colorStopType", "_value": "userStop" },
                                    "color": {
                                        "_obj": "RGBColor",
                                        "red": 255,
                                        "grain": 51,
                                        "blue": 0
                                    }
                                }
                            ],
                            "transparency": [
                                {
                                    "_obj": "transparencyStop",
                                    "location": 0,
                                    "midpoint": 50,
                                    "opacity": { "_unit": "percentUnit", "_value": 100 }
                                },
                                {
                                    "_obj": "transparencyStop",
                                    "location": 4096,
                                    "midpoint": 50,
                                    "opacity": { "_unit": "percentUnit", "_value": 100 }
                                }
                            ]
                        }
                    }], {});

                }, { commandName: 'Y2K Halftone Crush' });

                updateStatus('SUCCESS: Y2K HALFTONE CRUSH APPLIED', '#00FF41');
            } catch (error) {
                updateStatus('ERROR: ' + error.message, '#FF0000');
            }
        }

        // Attach event listeners - GLITCH
        document.getElementById('btn-rgb-linear').addEventListener('click', rgbSplitLinear);
        document.getElementById('btn-rgb-wave').addEventListener('click', rgbSplitWave);
        document.getElementById('btn-scanline').addEventListener('click', scanlineCorrupt);
        document.getElementById('btn-bitcrush').addEventListener('click', bitCrush);
        document.getElementById('btn-invert').addEventListener('click', invertColors);
        document.getElementById('btn-posterize').addEventListener('click', posterize);
        document.getElementById('btn-solarize').addEventListener('click', solarize);
        document.getElementById('btn-chromatic').addEventListener('click', chromaticAberration);

        // Attach event listeners - EXPERIMENTAL
        document.getElementById('btn-edge-detect').addEventListener('click', edgeDetect);
        document.getElementById('btn-emboss').addEventListener('click', emboss);
        document.getElementById('btn-gaussian-blur').addEventListener('click', gaussianBlur);
        document.getElementById('btn-sharpen').addEventListener('click', sharpen);
        document.getElementById('btn-oil-paint').addEventListener('click', oilPaint);
        document.getElementById('btn-mosaic').addEventListener('click', mosaic);
        document.getElementById('btn-pixelate').addEventListener('click', pixelate);
        document.getElementById('btn-radial-blur').addEventListener('click', radialBlur);

        // Attach event listeners - RETRO-TECH
        document.getElementById('btn-gameboy').addEventListener('click', gameBoy);
        document.getElementById('btn-c64').addEventListener('click', commodore64);
        document.getElementById('btn-cga').addEventListener('click', cgaPalette);
        document.getElementById('btn-sepia').addEventListener('click', sepiaTone);
        document.getElementById('btn-grayscale').addEventListener('click', grayscale);
        document.getElementById('btn-threshold').addEventListener('click', thresholdBW);
        document.getElementById('btn-duotone').addEventListener('click', duotone);
        document.getElementById('btn-vintage').addEventListener('click', vintageFilm);
        document.getElementById('btn-y2k-halftone').addEventListener('click', y2kHalftoneCrush);

        // Initialize
        updateStatus('READY - 25 FILTERS LOADED (8 GLITCH + 8 EXPERIMENTAL + 9 RETRO-TECH)', '#00CCFF');
    </script>
</body>
